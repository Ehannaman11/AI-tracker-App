<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tracker — Landing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap">
<style>
  :root{
    --ground:#0B0D10;
    --frame:#14171B;
    --raise:#1C2027;
    --line:#272D36;
    --ink:#EDF1F5;
    --ink-2:#9AA3AF;
    --ink-3:#6B7482;
    --go:#34D17A;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---- widget frame ---- */
  .screen{
    width:100%;
    max-width:360px;
    background:var(--frame);
    border:1px solid var(--line);
    border-radius:20px;
    height:552px;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
  }

  /* ---- logo lockup ---- */
  .lockup{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:rgba(255,255,255,.9);
    border-radius:11px;
    padding:11px 17px 11px 14px;
    align-self:flex-start;
  }
  .lockup span{
    color:#000;
    font-family:"Space Grotesk",var(--sans);
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.02em;
  }

  /* ---- buttons ---- */
  .btn{
    border:0;
    width:100%;
    border-radius:13px;
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    padding:16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:filter .15s ease, transform .06s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .btn-go{
    background:rgba(52,209,122,.25);
    color:#FFFFFF;
    border:3px solid var(--go);
    border-radius:13px;
    padding:14px 18px;
    transition:background .15s ease, transform .06s ease;
  }
  .btn-go:hover{background:rgba(52,209,122,.5)}

  /* ---- body copy ---- */
  .s1-body{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
  }
  .s1-body h2{
    margin:0;
    font-size:27px;
    line-height:1.15;
    font-weight:600;
    letter-spacing:-0.025em;
    text-wrap:balance;
  }
  .s1-body p{
    margin:0;
    color:var(--ink-2);
    font-size:14.5px;
    line-height:1.55;
  }
  .foot-note{
    margin:12px 0 0;
    text-align:center;
    color:var(--ink-3);
    font-size:12px;
  }

  @media (max-width:420px){
    .screen{height:auto;min-height:520px}
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="lockup">
      <svg width="28" height="26" viewBox="0 0 30 27" aria-hidden="true">
        <rect x="1.6" y="6.6" width="18.8" height="18.8" rx="4.5" fill="none" stroke="#000" stroke-width="2.6"/>
        <path d="M5.6 15.4 L11.4 21.2 L27.4 2.4" fill="none" stroke="#34D17A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>AI Tracker</span>
    </div>

    <div class="s1-body">
      <h2>Control the bot. Don&rsquo;t let it control you.</h2>
      <p>See how you prompt. Get better at it.</p>
    </div>

    <button class="btn btn-go" type="button" id="start-btn">Start Tracking*</button>
    <p class="foot-note">*Only runs while you turn it on.</p>
  </div>

  <script>
    // Wire this up to navigate to setup.html once these pages are hosted together.
    document.getElementById("start-btn").addEventListener("click", function () {
      window.location.href = "setup.html";
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tracker — Session Length</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
<style>
  :root{
    --ground:#0B0D10;
    --frame:#14171B;
    --raise:#1C2027;
    --line:#272D36;
    --ink:#EDF1F5;
    --ink-2:#9AA3AF;
    --ink-3:#6B7482;
    --go:#34D17A;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---- widget frame ---- */
  .screen{
    width:100%;
    max-width:360px;
    background:var(--frame);
    border:1px solid var(--line);
    border-radius:20px;
    height:552px;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
  }

  /* ---- logo lockup ---- */
  .lockup{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:rgba(255,255,255,.9);
    border-radius:11px;
    padding:8px 13px 8px 11px;
    align-self:flex-start;
  }
  .lockup span{
    color:#000;
    font-family:"Space Grotesk",var(--sans);
    font-weight:700;
    font-size:15px;
    letter-spacing:-0.02em;
  }

  /* ---- buttons ---- */
  .btn{
    border:0;
    width:100%;
    border-radius:13px;
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    padding:16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .btn-go{
    background:rgba(52,209,122,.25);
    color:#FFFFFF;
    border:3px solid var(--go);
    border-radius:13px;
    padding:14px 18px;
    transition:background .15s ease;
  }
  .btn-go:hover{background:rgba(52,209,122,.5)}

  /* ---- setup screen ---- */
  .s2-title{
    margin:26px 0 4px;
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.02em;
  }
  .s2-sub{
    margin:0 0 36px;
    color:var(--ink-3);
    font-size:13px;
    line-height:1.5;
  }
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--raise);
    border:1px solid var(--line);
    border-radius:13px;
    padding:15px 15px;
    cursor:pointer;
  }
  .opt .dot{
    width:18px;height:18px;border-radius:50%;
    border:2px solid var(--ink-3);
    flex:none;
  }
  .opt .name{font-size:15.5px;font-weight:500}
  .opt .hint{
    margin-left:auto;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-3);
  }
  .opt.on{border-color:var(--go);background:rgba(52,209,122,.09)}
  .opt.on .dot{border-color:var(--go);background:radial-gradient(circle,var(--go) 0 45%,transparent 46%)}
  .opt.on .name{color:var(--ink)}
  .s2-spacer{flex:1}

  @media (max-width:420px){
    .screen{height:auto;min-height:520px}
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="lockup">
      <svg width="24" height="22" viewBox="0 0 30 27" aria-hidden="true">
        <rect x="1.6" y="6.6" width="18.8" height="18.8" rx="4.5" fill="none" stroke="#000" stroke-width="2.6"/>
        <path d="M5.6 15.4 L11.4 21.2 L27.4 2.4" fill="none" stroke="#34D17A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>AI Tracker</span>
    </div>

    <h2 class="s2-title">How long should I track?</h2>
    <p class="s2-sub">Tracking stops on its own when time runs out.</p>

    <div class="opts" id="opts">
      <div class="opt on" data-minutes="30">
        <span class="dot"></span>
        <span class="name">30 minutes</span>
        <span class="hint">30:00</span>
      </div>
      <div class="opt" data-minutes="60">
        <span class="dot"></span>
        <span class="name">1 hour</span>
        <span class="hint">60:00</span>
      </div>
      <div class="opt" data-minutes="0">
        <span class="dot"></span>
        <span class="name">Variable</span>
        <span class="hint">until I stop</span>
      </div>
    </div>

    <div class="s2-spacer"></div>
    <button class="btn btn-go" type="button" id="go-btn">Go!</button>
  </div>

  <script>
    var opts = document.querySelectorAll(".opt");
    opts.forEach(function (opt) {
      opt.addEventListener("click", function () {
        opts.forEach(function (o) { o.classList.remove("on"); });
        opt.classList.add("on");
      });
    });

    // Wire this up to navigate to session.html once these pages are hosted together,
    // passing the chosen duration along (e.g. via a query string or shared state).
    document.getElementById("go-btn").addEventListener("click", function () {
      var chosen = document.querySelector(".opt.on");
      var minutes = chosen ? chosen.dataset.minutes : "30";
      window.location.href = "session.html?minutes=" + minutes;
    });
  </script>
</body>
</html>

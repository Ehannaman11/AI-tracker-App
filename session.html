<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tracker — Live Session</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@700&family=Nunito:wght@700&display=swap">
<style>
  :root{
    --ground:#0B0D10;
    --frame:#14171B;
    --raise:#1C2027;
    --line:#272D36;
    --ink:#EDF1F5;
    --ink-2:#9AA3AF;
    --ink-3:#6B7482;
    --go:#34D17A;
    --stop:#E24B4B;
    --warn:#F5C044;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---- widget frame ---- */
  .screen{
    width:100%;
    max-width:360px;
    background:var(--frame);
    border:1px solid var(--line);
    border-radius:20px;
    height:552px;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---- logo lockup ---- */
  .lockup{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:rgba(255,255,255,.9);
    border-radius:11px;
    padding:8px 13px 8px 11px;
    align-self:flex-start;
  }
  .lockup span{
    color:#000;
    font-family:"Space Grotesk",var(--sans);
    font-weight:700;
    font-size:15px;
    letter-spacing:-0.02em;
  }

  /* ---- buttons ---- */
  .btn{
    border:0;
    width:100%;
    border-radius:13px;
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    padding:16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .btn-stop{
    background:rgba(226,75,75,.25);
    color:rgba(255,255,255,.8);
    border:3px solid var(--stop);
    border-radius:5px;
    padding:14px 18px;
    transition:background .15s ease;
  }
  .btn-stop:hover{background:rgba(226,75,75,.5)}

  /* ---- top row / live clock ---- */
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .live{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
    color:var(--go);text-transform:uppercase;
  }
  .live i{width:7px;height:7px;border-radius:50%;background:var(--go);display:block}
  .live .clock{font-variant-numeric:tabular-nums;letter-spacing:.06em;font-size:12px}

  /* ---- rating ---- */
  .rating{
    margin:30px 0 20px;
    display:flex;
    align-items:center;
    gap:13px;
  }
  .grade{
    font-family:"Space Grotesk",var(--sans);
    font-size:34px;
    font-weight:700;
    color:var(--go);
    line-height:1;
    letter-spacing:-0.03em;
    background:var(--raise);
    border-radius:12px;
    padding:12px 14px;
  }
  .rating .txt{display:flex;flex-direction:column;gap:2px}
  .rating .txt b{font-size:12.5px;font-weight:600}
  .rating .txt small{color:var(--ink-3);font-size:11.5px;line-height:1.4}

  .divider{
    width:auto;
    height:0.5px;
    margin:0 -20px 18px;
    background:rgba(255,255,255,.25);
  }

  /* ---- "do this next" pill ---- */
  .tipwrap{margin:0 0 auto}
  .tipcard{
    position:relative;
    width:100%;
    display:flex;
    align-items:stretch;
    background:var(--raise);
    border-radius:12px;
    padding:0 15px 0 0;
    overflow:hidden;
    transition:opacity .2s ease;
  }
  .tip-flag{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    margin:0 12px 0 0;
    padding:10px 11px;
    text-align:center;
    background:rgba(245,192,68,.25);
    border:1px solid rgba(245,192,68,.5);
    border-radius:12px 0 0 12px;
    color:var(--warn);
    font-family:"Nunito",var(--sans);
    font-weight:700;
    font-size:13.5px;
    line-height:1.15;
  }
  .tip-flag svg{flex:none}
  .tip-body{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 0;
  }
  .tip-text{flex:1;min-width:0}
  .tip-body b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
  .tip-body span{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.4}
  .tip-check{
    position:relative;
    flex:none;
    width:22px;height:22px;
    padding:0;
    background:transparent;
    border:2px solid var(--ink-3);
    border-radius:5px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .tip-check::after{
    content:"";
    position:absolute;
    left:5.5px;top:1px;
    width:5px;height:11px;
    border:solid var(--go);
    border-width:0 2.6px 2.6px 0;
    transform:rotate(45deg) scale(0);
    transition:transform .13s ease;
  }
  .tip-check:hover,.tip-check.on{border-color:var(--go)}
  .tip-check:hover::after,.tip-check.on::after{transform:rotate(45deg) scale(1)}
  .tip-check:focus-visible{outline:2px solid var(--go);outline-offset:2px}
  .tipcard.done .tip-check{display:none}
  .tipcard.done{cursor:default}
  .tipcard.done .tip-flag{display:none}
  .tipcard.done .tip-body{padding-left:15px}
  @media (prefers-reduced-motion:reduce){
    .tip-check,.tip-check::after,.tipcard{transition:none}
  }

  /* ---- stats ---- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat{display:flex;flex-direction:column;gap:3px}
  .stat b{
    font-family:var(--mono);
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.01em;
  }
  .stat small{
    font-size:10px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-3);
  }
  .stats + .btn{margin-top:30px}

  @media (max-width:420px){
    .screen{height:auto;min-height:640px}
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="top-row">
      <div class="lockup">
        <svg width="24" height="22" viewBox="0 0 30 27" aria-hidden="true">
          <rect x="1.6" y="6.6" width="18.8" height="18.8" rx="4.5" fill="none" stroke="#000" stroke-width="2.6"/>
          <path d="M5.6 15.4 L11.4 21.2 L27.4 2.4" fill="none" stroke="#34D17A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>AI Tracker</span>
      </div>
      <span class="live"><i></i><span class="clock" id="clock">30:00</span></span>
    </div>

    <div class="rating">
      <div class="grade">B&minus;</div>
      <div class="txt">
        <b>Solid start</b>
        <small>You ask clear questions, but you take the first answer as final.</small>
      </div>
    </div>

    <div class="tipwrap">
      <div class="tipcard" id="tipcard">
        <div class="tip-flag">
          <svg width="19" height="19" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="#F5C044" stroke-width="1.5"/><path d="M8 4.2v4.5" fill="none" stroke="#F5C044" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="11.6" r="1" fill="#F5C044"/></svg>
          <span>Quick<br>Tip!</span>
        </div>
        <div class="tip-body">
          <div class="tip-text">
            <b id="tip-title">Say what it&rsquo;s for:</b>
            <span id="tip-desc">6 of your 9 prompts gave no audience, goal, or format.</span>
          </div>
          <button class="tip-check" id="tip-check" type="button" aria-label="Mark this tip done"></button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat"><b id="stat-elapsed">00:00</b><small>Elapsed</small></div>
      <div class="stat"><b>9</b><small>Prompts</small></div>
      <div class="stat"><b>2</b><small>Follow-ups</small></div>
    </div>

    <button class="btn btn-stop" type="button" id="stop-btn">Stop Tracking</button>
  </div>

  <script>
    (function () {
      /* ---- tip rotation ---- */
      var tips = [
        ["Say what it’s for:", "6 of your 9 prompts gave no audience, goal, or format."],
        ["Ask one thing at a time:", "Your longest prompt asked for four things at once."],
        ["Ask for the reasoning:", "Seeing the steps is how you catch a wrong answer."],
        ["Push back once:", "You followed up on only 2 of 9 answers."],
        ["Show an example:", "One sample of what “good” looks like beats describing it."]
      ];

      var card = document.getElementById("tipcard");
      var title = document.getElementById("tip-title");
      var desc = document.getElementById("tip-desc");
      var check = document.getElementById("tip-check");
      var i = 0, busy = false;

      function render() {
        if (i >= tips.length) {
          card.classList.add("done");
          title.textContent = "All caught up";
          desc.textContent = "Keep going — new suggestions appear as you work.";
          return;
        }
        title.textContent = tips[i][0];
        desc.textContent = tips[i][1];
      }

      function complete() {
        if (busy || i >= tips.length) return;
        busy = true;
        check.classList.add("on");
        card.style.opacity = "0";
        setTimeout(function () {
          i++;
          render();
          check.classList.remove("on");
          card.style.opacity = "";
          busy = false;
        }, 210);
      }

      check.addEventListener("click", complete);
      render();

      /* ---- countdown, driven by ?minutes= from setup.html ---- */
      var params = new URLSearchParams(window.location.search);
      var minutesParam = params.get("minutes");
      var totalSeconds = minutesParam && Number(minutesParam) > 0 ? Number(minutesParam) * 60 : 30 * 60;
      var isVariable = minutesParam === "0";
      var remaining = totalSeconds;
      var elapsed = 0;

      var clockEl = document.getElementById("clock");
      var elapsedEl = document.getElementById("stat-elapsed");

      function fmt(sec) {
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      }

      function tick() {
        elapsed++;
        elapsedEl.textContent = fmt(elapsed);

        if (!isVariable) {
          remaining--;
          clockEl.textContent = fmt(Math.max(0, remaining));
          if (remaining <= 0) {
            clearInterval(timer);
            // Session time's up — wire this to your actual stop/summary flow.
          }
        } else {
          clockEl.textContent = fmt(elapsed);
        }
      }

      if (isVariable) clockEl.textContent = "00:00";
      var timer = setInterval(tick, 1000);

      document.getElementById("stop-btn").addEventListener("click", function () {
        clearInterval(timer);
        // Wire this up to your actual "end session" flow (e.g. a summary screen).
        window.location.href = "landing.html";
      });
    })();
  </script>
</body>
</html>
